[package]
name = "fastsim"
version = "0.28.3"
edition = "2021"
description = "A fast, Rust-based block-diagram system simulation framework — drop-in replacement for pathsim"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "fastsim"
crate-type = ["cdylib", "rlib"]

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "sparse-linalg"] }
smallvec = "1.13"
libm = "0.2"
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3 = { version = "0.29", features = ["extension-module", "num-complex"], optional = true }
# Structural code emission (the `codegen` module) is driven by Jinja templates;
# minijinja is the pure-Rust Jinja2 engine.
minijinja = "2"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"

# Native-only capabilities. Everything else compiles for every target (incl.
# WASM/Pyodide); these two are the only genuinely platform-bound dependencies:
# libloading (dlopen for FMU *import*) and rayon (threads for batch runs) have
# no WASM equivalent, tempfile backs the FMU-import unzip cache.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libloading = "0.8"
tempfile = "3"
rayon = "1"
[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["plotters", "cargo_bench_support"] }

[[bench]]
name = "event_loop"
harness = false

[[bench]]
name = "lstsq_micro"
harness = false

[[bench]]
name = "jit_tape_micro"
harness = false

[[bench]]
name = "ops_tape_vs_native"
harness = false

[[bench]]
name = "sim_tape_vs_native"
harness = false

[[bench]]
name = "statespace_matvec"
harness = false

[[bench]]
name = "newton_cache"
harness = false

[[bench]]
name = "stiff_statespace"
harness = false

[[bench]]
name = "stiff_compiled"
harness = false

[[bench]]
name = "stiff_sparse"
harness = false

[[bench]]
name = "sparse_jacobian_system"
harness = false

[features]
# The only feature: pyo3 linkage for the Python extension module (maturin sets
# it). Everything functional (codegen, FMI import/export, parallel batch) is
# always compiled; platform-bound parts are target-gated, never feature-gated.
python = ["pyo3"]

[profile.release]
lto = true
codegen-units = 1
# Strip symbols from release wheels — smaller artifacts, no runtime effect
# (issue #47).
strip = "symbols"
